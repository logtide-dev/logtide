name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Prevent duplicate runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10'

# Restrict permissions for all jobs (principle of least privilege)
permissions:
  contents: read
  actions: read

jobs:
  # ====================
  # Backend Tests
  # ====================
  backend-test:
    # Six shards in parallel, each with its own database: the suite runs its
    # files one at a time against a shared database (fileParallelism: false),
    # so a single runner took about 24 minutes.
    name: Backend Tests (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: logtide_test
          POSTGRES_USER: logtide_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5433:5432
        # A throwaway database: on tmpfs, with room for parallel queries.
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --shm-size=1g
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mailhog:
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Turn off durability on the test database
        # Service containers take no command line; these settings reload
        # without a restart. Every commit of the suite gets cheaper.
        env:
          PGPASSWORD: test_password
        run: |
          for setting in "fsync = off" "synchronous_commit = off" "full_page_writes = off"; do
            psql -h localhost -p 5433 -U logtide_test -d logtide_test -c "ALTER SYSTEM SET $setting"
          done
          psql -h localhost -p 5433 -U logtide_test -d logtide_test -c "SELECT pg_reload_conf()"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter '@logtide/shared' build

      - name: Build reservoir package
        run: pnpm --filter '@logtide/reservoir' build

      - name: Run backend tests (shard ${{ matrix.shard }}/6)
        working-directory: packages/backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://logtide_test:test_password@localhost:5433/logtide_test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5433
          DB_USER: logtide_test
          DB_PASSWORD: test_password
          DB_NAME: logtide_test
          REDIS_URL: redis://localhost:6380
          API_KEY_SECRET: test_secret_key_32_chars_long!!!
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_USER: ''
          SMTP_PASS: ''
          SMTP_FROM: test@logtide.dev
          RATE_LIMIT_MAX: 1000
          RATE_LIMIT_WINDOW: 60000
        # Coverage thresholds apply to the merged report (backend-coverage),
        # not to one shard's part of it.
        run: >-
          npx vitest run --shard=${{ matrix.shard }}/6 --coverage
          --coverage.thresholds.lines=0 --coverage.thresholds.functions=0
          --coverage.thresholds.branches=0 --coverage.thresholds.statements=0
          --reporter=default --reporter=blob

      - name: Upload shard report
        uses: actions/upload-artifact@v4
        with:
          name: backend-blob-${{ matrix.shard }}
          path: packages/backend/.vitest-reports/*
          include-hidden-files: true
          retention-days: 1

  backend-coverage:
    # The required check for the backend suite: every shard passed, and the
    # merged coverage meets the thresholds of vitest.config.ts.
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [backend-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: backend-blob-*
          path: packages/backend/.vitest-reports
          merge-multiple: true

      - name: Merge reports and check coverage thresholds
        working-directory: packages/backend
        run: npx vitest run --merge-reports --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/backend/coverage/lcov.info,./packages/backend/coverage/coverage-final.json
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          verbose: true

      - name: Check coverage threshold
        working-directory: packages/backend
        run: |
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Line coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "::error::Coverage $COVERAGE% is below 80% threshold"
            exit 1
          fi
          echo "::notice::Coverage $COVERAGE% meets the 80% threshold"

  # ====================
  # Reservoir Tests
  # ====================
  reservoir-test:
    name: Reservoir Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: logtide_test
          POSTGRES_USER: logtide_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      clickhouse:
        image: clickhouse/clickhouse-server:24.1
        env:
          CLICKHOUSE_DB: logtide_test
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 18123:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter '@logtide/shared' build

      - name: Build reservoir package
        run: pnpm --filter '@logtide/reservoir' build

      - name: Run reservoir tests with coverage
        working-directory: packages/reservoir
        env:
          REDIS_URL: redis://localhost:6380
          RESERVOIR_TIMESCALE_URL: postgresql://logtide_test:test_password@localhost:5433/logtide_test
          RESERVOIR_CLICKHOUSE_URL: http://default:@localhost:18123/logtide_conformance
          RESERVOIR_MONGODB_URL: mongodb://localhost:27017/logtide_conformance
          RESERVOIR_CONFORMANCE_REQUIRED: '1'
        run: npx vitest run --coverage --coverage.reporter=text --coverage.reporter=lcov --coverage.reporter=json --reporter=verbose

      - name: Upload reservoir coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/reservoir/coverage/lcov.info,./packages/reservoir/coverage/coverage-final.json
          flags: reservoir
          name: reservoir-coverage
          fail_ci_if_error: false
          verbose: true

  # ====================
  # Typecheck
  # ====================
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter '@logtide/shared' build

      - name: Build reservoir package
        run: pnpm --filter '@logtide/reservoir' build

      - name: Typecheck backend
        run: pnpm --filter '@logtide/backend' typecheck

      - name: Tenant scoping check
        working-directory: packages/backend
        run: npm run check:tenant-scoping

      - name: Typecheck frontend
        env:
          PUBLIC_API_URL: http://localhost:8080
        run: pnpm --filter '@logtide/frontend' typecheck

  # ====================
  # Shared + Frontend Unit Tests
  # ====================
  unit-test-shared-frontend:
    name: Shared + Frontend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter '@logtide/shared' build

      - name: Run shared unit tests
        run: pnpm --filter '@logtide/shared' test

      - name: Run frontend unit tests
        env:
          PUBLIC_API_URL: http://localhost:8080
        run: pnpm --filter '@logtide/frontend' test

  # ====================
  # E2E Tests (Playwright)
  # ====================
  e2e-test:
    # Two shards, each with its own stack; independent of the unit and
    # integration jobs, so it starts right away.
    name: E2E Tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04  # playwright 1.57 has no chromium build for ubuntu 26.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: packages/frontend
        run: npx playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test images (cached)
        # The backend and frontend images, from the GitHub Actions cache
        # instead of a cold `compose up --build` every run.
        uses: docker/bake-action@v5
        with:
          files: docker-compose.test.yml
          targets: backend-test,frontend-test
          load: true
          set: |
            *.cache-from=type=gha,scope=e2e
            *.cache-to=type=gha,scope=e2e,mode=max

      - name: Start test infrastructure
        run: |
          docker compose -f docker-compose.test.yml up -d
          # Wait for services to be healthy
          echo "Waiting for services to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:3001/health > /dev/null; do sleep 2; done'
          echo "Backend is ready"
          timeout 120 bash -c 'until curl -s http://localhost:3002 > /dev/null; do sleep 2; done'
          echo "Frontend is ready"
          # The worker runs the alert cron and notification jobs the alert-to-incident journey needs
          docker compose -f docker-compose.test.yml ps worker-test --format '{{.State}}' | grep -q running
          echo "Worker is running"

      - name: Run E2E tests
        working-directory: packages/frontend
        env:
          E2E: 'true'
          TEST_API_URL: http://localhost:3001
          TEST_FRONTEND_URL: http://localhost:3002
        run: npx playwright test --reporter=list --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: packages/frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.shard }}
          path: packages/frontend/test-results/
          retention-days: 7

      - name: Stop test infrastructure
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  e2e-result:
    # Keeps the "E2E Tests" check name for branch protection.
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [e2e-test]
    if: always()
    steps:
      - name: Every E2E shard passed
        run: test "${{ needs.e2e-test.result }}" = "success"

  # ====================
  # Hardware agent tests (stdlib only, no dependencies)
  # ====================
  hw-agent:
    name: Hardware Agent Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: python -m unittest discover -s hw-agent/tests -v

  # ====================
  # Build Docker Images
  # ====================
  build:
    # Only checks that the images build; nothing waits for it and it waits
    # for nothing.
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/backend/Dockerfile
          push: false
          tags: logtide/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/frontend/Dockerfile
          push: false
          tags: logtide/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build hw-agent image
        uses: docker/build-push-action@v5
        with:
          context: hw-agent
          push: false
          tags: logtide/hw-agent:${{ github.sha }}
